project:
  type: website
  pre-render:
    - python scripts/build_site_data.py
  post-render:
    - python scripts/test_site_metrics.py
  render:
    - index.qmd
    - geography.qmd
    - outlook.qmd
    - jobs.qmd
    - skills.qmd
    - work.qmd
    - eda_pharma.qmd
    - about.qmd
  resources:
    - /outputs/us-employer-inventory/web/**
    - /outputs/us-employer-inventory/curated/**
    - /outputs/site-reference/data/**
    - /outputs/employer-page-review/data/**
    - /scripts/dashboard.js

website:
  title: "PHARMA / CAREERS"
  navbar:
    right:
      - icon: github
        text: GitHub
        href: https://github.com/nakulpadalkar/AD688-G0-F26-pharma-careers
        aria-label: View the Pharma Careers GitHub repository
    left:
      - href: index.qmd
        text: Home
      - text: Market
        menu:
          - href: geography.qmd
            text: US opportunity map
          - href: outlook.qmd
            text: Growth & pay
      - href: jobs.qmd
        text: Jobs
      - text: Skills & work
        menu:
          - href: skills.qmd
            text: Skills & tasks
          - href: work.qmd
            text: Work in practice
      - href: about.qmd
        text: Certificate
      - href: eda_pharma.qmd
        text: Sources

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    toc: false
    page-layout: article
    grid:
      body-width: 1100px
      sidebar-width: 140px
      margin-width: 140px
      gutter-width: 20px
    title-block-banner: false
    anchor-sections: false
    smooth-scroll: true
    lang: en



